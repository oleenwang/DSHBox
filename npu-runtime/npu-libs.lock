# npu-runtime 原生库的固定快照
#
# 这些库不进版本控制（libllama.so 42 MB + ggml 全家 60 MB+，且 libggml-htp-v8x.so
# 是 Qualcomm 的 DSP 二进制）。它们由 .github/workflows/npu-libs-release.yml 编译、
# 打包成 Release 附件，这里钉住版本和校验值。
#
# 怎么更新：
#   1. 手动触发 npu-libs-release 工作流（或推一个 npu-libs-* tag）
#   2. 工作流跑完后，它会在 summary 里打印下面这几行
#   3. 原样抄回本文件
#
# 只想要某个 HTP 版本、省约 5 MB：打包时给工作流传 only=v81（按设备改）。
#
# 未标定的 sha256 会让 downloadNpuLibs 直接报错停下 —— 这是故意的：
# 拿一批没校验的库编出 APK，运行时的崩溃比构建失败难查得多。

version=npu-libs-v0-UNSET
