name: NPU Module Build Verify

# 仅用于本地 fork 的构建验证：上游 PR 的 CI 需要维护者批准才能跑，
# 所以在独立分支上复现同样的构建步骤，确认 npu-runtime 能编译并通过单测。
on:
  push:
    branches: [ 'verify/npu-build' ]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Accept licenses & install SDK packages
        run: |
          sdkmanager --update >/dev/null 2>&1 || true
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          sdkmanager "ndk;27.0.12077973"

      - name: Grant execute permission to scripts
        run: chmod +x gradlew tools/*.sh

      - name: Build and test npu-runtime
        run: >-
          ./gradlew
          :npu-runtime:assembleDebug
          :npu-runtime:testDebugUnitTest
          --stacktrace

      - name: Assemble app debug APK (includes npu-runtime)
        run: ./gradlew :app:assembleDebug --stacktrace
