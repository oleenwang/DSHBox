name: NPU real-machine verify build

# 只为真机验证构建一个可安装的 APK：
#  · applicationId 改成 com.dshbox.app.probe（不覆盖用户正在用的 dshbox）
#  · 把 libGenie.so 打进 jniLibs（设备上没这个库，PR 的 dlopen 会失败）
on:
  push:
    branches: [ 'verify/npu-real' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with: { packages: 'platform-tools' }
      - name: SDK + NDK
        run: |
          sdkmanager --update >/dev/null 2>&1 || true
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" "ndk;27.0.12077973"
      - name: chmod
        run: chmod +x gradlew tools/*.sh || true
      - name: Assemble debug APK
        run: ./gradlew :app:assembleSystemWebViewDebug --stacktrace
      - name: Assert npu bits are packaged
        run: |
          APK=$(find app/build/outputs/apk -name '*.apk' | head -1)
          echo "APK=$APK"
          unzip -l "$APK" | grep -E 'libnpu-genie\.so|libGenie\.so' || { echo '::error::npu libs missing'; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: npu-real-verify-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
